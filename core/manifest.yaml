schema_version: "1.0"
skill_version: "0.10.0-alpha11"

load_tiers:
  L0: { max_tokens_hint: 8000 }
  L1: { max_tokens_hint: 40000 }
  L2: { max_tokens_hint: 80000 }
  L3: { max_tokens_hint: 120000 }
  L4: { forbidden_for: [coordinator] }

disclosure_tiers:
  D0: { reportable: false }
  D1: { reportable: false }
  D2: { reportable: internal }
  D3: { reportable: maintainer }
  D4: { reportable: public_after_fix }

schema_root: schemas

registered_schemas:
  - bilingual-output.schema.json
  - candidate.schema.json
  - context-budget.schema.json
  - cvss.schema.json
  - environment-check.schema.json
  - finding.schema.json
  - hypothesis.schema.json
  - install-assistant-decision.schema.json
  - install-assistant-summary.schema.json
  - package-profile.schema.json
  - poc-testcase.schema.json
  - public-vuln-correlation.schema.json
  - public-vuln-record.schema.json
  - report.schema.json
  - tool-install-plan.schema.json
  - tool-summary.schema.json
  - validation-target.schema.json
  - validation-result.schema.json
  - workflow-step.schema.json
  - exception-index.schema.json
  - intake.schema.json
  - openeuler-vuln-registry.schema.json

l4_forbidden_patterns:
  - "audit-output/**/raw/**"
  - "audit-output/**/packets/**"
  - "audit-output/**/all-files.txt"
  - "audit-output/**/source-files.txt"
  - "offline-bundle/vuln-db/openeuler/cve-index.json"
  - "offline-bundle/vuln-db/openeuler/records.json"

stages:
  - step_id: "00-intake"
    workflow_doc: workflows/00-intake.md
    audit_output_dir: audit-output/00-intake
    load_tier_guide: L2
  - step_id: "00-workflow-contract"
    workflow_doc: null
    audit_output_dir: audit-output/machine
  - step_id: "00-manifest-validation"
    workflow_doc: null
    audit_output_dir: audit-output/machine
  - step_id: "00-environment"
    workflow_doc: null
    audit_output_dir: audit-output/00-environment
  - step_id: "01-package-profile"
    workflow_doc: workflows/01-package-profile.md
    audit_output_dir: audit-output/01-profile
  - step_id: "02-scope-selection"
    workflow_doc: workflows/02-scope-selection.md
    audit_output_dir: audit-output/01-profile
  - step_id: "03-tool-scan"
    workflow_doc: workflows/03-tool-scan.md
    audit_output_dir: audit-output/02-tools
  - step_id: "04-ai-hypothesis"
    workflow_doc: workflows/04-ai-hypothesis.md
    audit_output_dir: audit-output/03-candidates
  - step_id: "05-candidate-review"
    workflow_doc: workflows/05-candidate-review.md
    audit_output_dir: audit-output/03-candidates
  - step_id: "06-validation"
    workflow_doc: workflows/06-validation.md
    audit_output_dir: audit-output/04-validation
  - step_id: "07-cvss-scoring"
    workflow_doc: workflows/07-cvss-scoring.md
    audit_output_dir: audit-output/05-findings
  - step_id: "08-report"
    workflow_doc: workflows/08-report.md
    audit_output_dir: audit-output/06-report
  - step_id: "09-progressive-disclosure"
    workflow_doc: workflows/09-progressive-disclosure.md
    audit_output_dir: audit-output/07-disclosure
  - step_id: "10-final-completeness"
    workflow_doc: null
    audit_output_dir: audit-output/machine

artifacts:
  - id: scope-md
    path_pattern: audit-output/00-intake/scope.md
    load_tier: L1
    step_id: "00-intake"
  - id: intake-json
    path_pattern: audit-output/00-intake/intake.json
    load_tier: L1
    schema: intake.schema.json
    step_id: "00-intake"
  - id: tool-summary
    path_pattern: audit-output/02-tools/tool-summary.json
    load_tier: L1
    schema: tool-summary.schema.json
    step_id: "03-tool-scan"
    exception_policy:
      on_failed_after_retries: fail_pipeline
      on_recoverable: record_and_continue
  - id: validation-targets
    path_pattern: audit-output/04-validation/validation-targets.json
    load_tier: L1
    schema: validation-target.schema.json
    step_id: "06-validation"
  - id: finding-index
    path_pattern: audit-output/05-findings/finding-index.json
    load_tier: L1
    step_id: "06-validation"
  - id: exception-index
    path_pattern: audit-output/machine/exception-index.json
    load_tier: L1
    schema: exception-index.schema.json
    step_id: "09-progressive-disclosure"
  - id: recipes
    path_pattern: recipes/**
    load_tier: L3
  - id: templates
    path_pattern: templates/**
    load_tier: L3
  - id: public-vuln-correlation
    path_pattern: audit-output/machine/correlation/public-vuln-correlation.json
    load_tier: L1
  - id: apply-correlation-result
    path_pattern: audit-output/machine/correlation/apply-correlation-result.json
    load_tier: L1

exception_aggregation:
  index_path: audit-output/machine/exception-index.json
  schema: exception-index.schema.json
  schema_path: schemas/exception-index.schema.json
  load_tier: L1
