name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Run regression tests
        run: python -m pytest -q tests

  workflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate workflow contract
        run: python3 tools/enforce_workflow_contract.py --root . --out /tmp/workflow-contract.json
      - name: Validate manifest
        run: python3 tools/validate_manifest.py --root . --out /tmp/manifest-validation.json
